<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>English Curriculum Map · A0 → B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:oklch(0.985 0.006 85);
  --paper-2:oklch(0.972 0.009 82);
  --surface:oklch(0.997 0.003 85);
  --ink:oklch(0.24 0.012 60);
  --ink-2:oklch(0.42 0.012 60);
  --muted:oklch(0.56 0.012 65);
  --line:oklch(0.885 0.008 75);
  --line-2:oklch(0.93 0.006 80);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --display:var(--serif);
  --maxw:1120px;
  --pad:40px;
  --accent:oklch(0.58 0.13 60);
  --accent-deep:oklch(0.46 0.13 60);
  --accent-tint:oklch(0.965 0.045 60);
  --accent-soft:oklch(0.92 0.045 60);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
[data-display="sans"]{--display:var(--sans);}
.page[data-density="compact"]{--pad:24px;}

/* ============ Masthead ============ */
.masthead{border-bottom:1px solid var(--line);background:
  radial-gradient(120% 140% at 100% 0%, var(--accent-tint) 0%, transparent 55%),
  var(--paper);}
.mast-inner{max-width:var(--maxw);margin:0 auto;padding:64px var(--pad) 40px;}
.overline{font-family:var(--mono);font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted);margin:0 0 22px;}
.title{font-family:var(--display);font-weight:500;
  font-size:clamp(46px,8vw,92px);line-height:0.98;letter-spacing:-0.02em;
  margin:0 0 26px;color:var(--ink);text-wrap:balance;font-variant-numeric:lining-nums;}
.lede{font-size:clamp(17px,2.1vw,21px);line-height:1.5;max-width:46ch;
  color:var(--ink-2);margin:0;font-weight:400;}
.lede strong{color:var(--ink);font-weight:600;}
.welcome{font-family:var(--display);font-size:clamp(18px,2.4vw,23px);color:var(--accent-deep);
  margin:-12px 0 22px;font-weight:500;}
.welcome em{font-style:italic;}
.lede em{font-family:var(--display);font-style:italic;}
.mast-stats{display:flex;align-items:center;gap:18px;margin-top:34px;
  padding-top:24px;border-top:1px solid var(--line);flex-wrap:wrap;}
.stat{font-size:14px;color:var(--ink-2);}
.stat b{font-family:var(--display);font-weight:600;font-size:19px;color:var(--ink);
  letter-spacing:-0.01em;margin-right:5px;font-variant-numeric:lining-nums;}
.stat-div{width:1px;height:22px;background:var(--line);}

/* ============ Site tabs ============ */
.site-tabs{border-bottom:1px solid var(--line);background:var(--paper);}
.site-tabs-inner{max-width:var(--maxw);margin:0 auto;padding:12px var(--pad);
  display:flex;gap:8px;flex-wrap:wrap;}
.site-tab,.language-tab{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:9px 14px;cursor:pointer;transition:.15s ease;}
.site-tab:hover,.language-tab:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-tint);}
.site-tab.is-active,.language-tab.is-active{background:var(--ink);border-color:var(--ink);color:var(--paper);}

/* ============ Toolbar ============ */
.toolbar{position:sticky;top:0;z-index:40;background:color-mix(in oklab,var(--paper) 86%,transparent);
  backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line);}
.toolbar-inner{max-width:var(--maxw);margin:0 auto;padding:12px var(--pad);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between;}
.pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:.04em;
  padding:7px 13px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:7px;
  white-space:nowrap;transition:.16s ease;}
.pill:hover{border-color:var(--ink-2);color:var(--ink);}
.pill-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.pill.is-active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.pill.is-active .pill-dot{background:var(--accent);}
.toolbar-right{display:flex;align-items:center;gap:10px;}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  background:var(--surface);border-radius:999px;padding:7px 14px;min-width:240px;}
.search:focus-within{border-color:var(--ink-2);}
.search-ico{color:var(--muted);font-size:16px;}
.search input{border:0;background:transparent;outline:none;font-family:var(--sans);
  font-size:14px;color:var(--ink);width:100%;}
.search-clear{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:2px;}
.reset{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);
  background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;}
.reset:hover{color:var(--ink);border-color:var(--ink-2);}

/* ============ Explainers + tabs ============ */
.explainer{max-width:var(--maxw);margin:0 auto;padding:34px var(--pad) 10px;}
.explainer-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;}
.explainer-grid{display:grid;grid-template-columns:minmax(260px,1fr) 1.2fr;gap:24px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;}
.explainer h2,.tab-title{font-family:var(--display);font-weight:500;letter-spacing:-0.02em;color:var(--ink);}
.explainer h2{font-size:clamp(28px,4vw,44px);line-height:1.05;margin:0;}
.explainer p{margin:0;color:var(--ink-2);font-size:15.5px;line-height:1.55;}
.explainer-points{display:grid;gap:12px;}
.explainer-points p{padding-left:14px;border-left:2px solid var(--accent-soft);}
.explainer-points b{color:var(--accent-deep);}
.tab-page{max-width:var(--maxw);margin:0 auto;padding:44px var(--pad) 72px;}
.tab-title{font-size:clamp(42px,7vw,76px);line-height:.98;margin:0 0 22px;}
.tab-lede{font-size:clamp(17px,2vw,21px);line-height:1.5;color:var(--ink-2);max-width:62ch;margin:0 0 30px;}
.tab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.info-panel,.language-panel,.dictionary-result,.transfer-card{background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:22px;}
.info-panel h2,.language-panel h2{font-family:var(--display);font-weight:500;font-size:25px;margin:0 0 10px;}
.info-panel p,.language-panel p,.transfer-card p,.dictionary-result p{color:var(--ink-2);margin:0;line-height:1.55;}
.language-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;}
.language-panel{padding:28px;}
.transfer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px;}
.transfer-source{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-deep);}
.transfer-card h3{font-size:17px;line-height:1.25;margin:8px 0 10px;color:var(--ink);}
.dictionary-tool{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;}
.dictionary-controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px;}
.dictionary-input{display:flex;flex-direction:column;gap:6px;flex:1;min-width:220px;}
.dictionary-input.small{flex:.35;min-width:160px;}
.dictionary-input span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.dictionary-input input,.dictionary-input select{font:inherit;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;}
.dictionary-input input:focus,.dictionary-input select:focus{border-color:var(--accent);}
.dictionary-word{font-family:var(--display);font-size:30px;color:var(--ink)!important;margin-bottom:8px!important;}
.dictionary-word span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-left:8px;}
.dictionary-result ul{margin:12px 0 0;color:var(--ink-2);}
.dictionary-note{margin-top:12px!important;color:var(--accent-deep)!important;}
.floating-dict{position:fixed;right:18px;bottom:18px;z-index:60;}
.floating-dict-button{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:999px;padding:12px 16px;
  cursor:pointer;box-shadow:0 12px 34px -22px var(--ink);}
.floating-dict-panel{width:min(420px,calc(100vw - 36px));background:color-mix(in oklab,var(--surface) 94%,transparent);
  backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;
  box-shadow:0 18px 44px -26px var(--ink);}
.floating-dict-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.floating-dict-head b{font-family:var(--display);font-size:20px;font-weight:500;}
.floating-dict-head button{font-family:var(--mono);font-size:11px;color:var(--muted);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;}
.dictionary-tool.compact{border:0;padding:0;background:transparent;}
.dictionary-tool.compact .dictionary-input{min-width:140px;}
.blog-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.blog-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;
  display:flex;flex-direction:column;gap:12px;}
.post-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.blog-card h2{font-family:var(--display);font-size:30px;line-height:1.05;font-weight:500;
  letter-spacing:-0.01em;margin:0;color:var(--ink);}
.blog-card p{margin:0;color:var(--ink-2);line-height:1.55;}
.blog-card button{align-self:flex-start;margin-top:auto;font-family:var(--mono);font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep);background:var(--accent-tint);
  border:1px solid var(--accent-soft);border-radius:999px;padding:9px 13px;cursor:pointer;}
.blog-card button:hover{border-color:var(--accent);background:var(--surface);}
.placement-hero{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:stretch;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;margin:0 0 18px;}
.placement-kicker{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-deep);margin-bottom:12px;}
.placement-hero h2{font-family:var(--display);font-size:clamp(34px,5vw,58px);line-height:1;
  font-weight:500;letter-spacing:-0.02em;margin:0 0 14px;color:var(--ink);}
.placement-hero p{color:var(--ink-2);font-size:17px;line-height:1.55;max-width:58ch;margin:0 0 22px;}
.placement-cta{display:inline-flex;text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;background:var(--ink);color:var(--paper);border:1px solid var(--ink);
  border-radius:999px;padding:12px 16px;}
.placement-cta:hover{background:var(--accent-deep);border-color:var(--accent-deep);}
.placement-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.placement-stats span{background:var(--accent-tint);border:1px solid var(--accent-soft);border-radius:14px;
  padding:16px;color:var(--ink-2);font-size:14px;}
.placement-stats b{display:block;font-family:var(--display);font-size:28px;line-height:1.05;
  font-weight:500;color:var(--accent-deep);}

/* ============ Journey ============ */
.journey{max-width:var(--maxw);margin:0 auto;padding:30px var(--pad) 6px;}
.journey-track{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.stop{position:relative;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:13px;padding:14px 14px 16px;
  cursor:pointer;transition:.18s ease;display:flex;flex-direction:column;}
.stop:hover{transform:translateY(-3px);border-color:var(--accent);
  box-shadow:0 10px 24px -16px var(--accent-deep);}
.stop.is-active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.stop-rule{height:3px;border-radius:999px;background:var(--accent);margin-bottom:13px;
  width:34px;transition:width .25s ease;}
.stop:hover .stop-rule,.stop.is-active .stop-rule{width:100%;}
.stop-code{font-family:var(--sans);font-size:25px;font-weight:700;color:var(--accent-deep);line-height:1;letter-spacing:-0.02em;font-variant-numeric:lining-nums;}
.stop-name{font-size:13.5px;font-weight:600;margin-top:5px;}
.stop-hours{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.02em;}

/* ============ Sections ============ */
.sections{max-width:var(--maxw);margin:0 auto;padding:20px var(--pad) 40px;}
.level{padding:48px 0;border-top:1px solid var(--line);scroll-margin-top:80px;}
.level:first-child{border-top:0;}
.level-head{display:grid;grid-template-columns:minmax(180px,250px) 1fr;gap:36px;align-items:start;}
.level-mark{display:flex;flex-direction:column;border-left:3px solid var(--accent);padding-left:20px;}
.level-code{font-family:var(--sans);font-size:clamp(52px,8.5vw,80px);font-weight:700;
  line-height:0.9;color:var(--accent-deep);letter-spacing:-0.03em;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;}
.level-name{font-family:var(--display);font-style:italic;font-size:22px;color:var(--ink-2);margin-top:6px;}
.level-cefr{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:4px 0 12px;}
.level-blurb{font-size:17.5px;line-height:1.55;color:var(--ink-2);margin:0 0 18px;max-width:62ch;}
.level-chips{display:flex;gap:10px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;white-space:nowrap;}
.chip-k{flex:none;}
.chip-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.chip--prog{padding:4px 12px 4px 6px;}
.chip--prog .ring text{font-family:var(--mono);font-size:9px;}

/* assessment path */
.assessment-band{margin:30px 0 28px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);
  gap:12px;align-items:stretch;}
.assessment-card,.assessment-evidence{background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:20px;text-decoration:none;color:var(--ink);min-width:0;}
.assessment-card{transition:.16s ease;}
.assessment-card:hover{transform:translateY(-2px);border-color:var(--accent);
  background:var(--accent-tint);box-shadow:0 12px 28px -22px var(--accent-deep);}
.assessment-card--exit{border-color:var(--accent-soft);}
.assessment-label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.assessment-card h3{font-family:var(--display);font-size:26px;line-height:1.08;font-weight:500;
  margin:0 0 10px;color:var(--ink);}
.assessment-card p{font-size:14.5px;line-height:1.5;color:var(--ink-2);margin:0;}
.assessment-evidence{background:color-mix(in oklab,var(--accent-tint) 45%,var(--surface));}
.assessment-evidence ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;}
.assessment-evidence li{position:relative;padding-left:15px;font-size:14px;line-height:1.45;color:var(--ink-2);}
.assessment-evidence li::before{content:"";position:absolute;left:0;top:.65em;width:6px;height:6px;
  border-radius:50%;background:var(--accent);}

/* can-do banner */
.cando{margin:32px 0 28px;background:var(--accent-tint);border:1px solid var(--accent-soft);
  border-radius:16px;padding:26px 30px;}
.code-inline{font-family:var(--sans);font-weight:700;font-style:normal;letter-spacing:-0.01em;}
.cando-title{font-family:var(--display);font-size:20px;font-weight:500;font-style:italic;
  margin:0 0 16px;color:var(--ink);}
.cando-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;}
.cando-item{display:flex;gap:11px;font-size:15px;line-height:1.45;color:var(--ink);}
.cando-bullet{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:8px;}

/* grid of cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:20px 20px 22px;}
.card--wide{grid-column:span 2;}
.card-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--line-2);}
.card-index{font-family:var(--mono);font-size:12px;color:var(--accent-deep);font-weight:500;}
.card-label{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--ink);}

/* lesson links + skill lines */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
.list--two{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;}
.list--plain{gap:9px;}
.item{font-size:14.5px;line-height:1.4;color:var(--ink-2);}
.item-link{display:flex;gap:10px;align-items:baseline;justify-content:space-between;
  text-decoration:none;color:var(--ink);padding:6px 8px;margin:0 -8px;border-radius:8px;
  transition:.13s ease;}
.item-link:hover{background:var(--accent-tint);color:var(--accent-deep);}
.item-link .item-text{flex:1;}
.item-go{flex:none;font-size:13px;color:var(--accent);opacity:0;transform:translateX(-4px);
  transition:.15s ease;}
.item-link:hover .item-go{opacity:1;transform:translateX(0);}
.item--static{display:flex;gap:10px;align-items:flex-start;padding:0;}
.item-tick{flex:none;width:6px;height:6px;border-radius:50%;border:1.5px solid var(--accent);
  margin-top:7px;}
.item--static .item-text{flex:1;color:var(--ink-2);}

.chips-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.vchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);
  background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;
  white-space:nowrap;text-decoration:none;transition:.13s ease;}
.vchip:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-tint);}
.vchip-go{font-size:12px;color:var(--accent);opacity:.55;}
.vchip:hover .vchip-go{opacity:1;}
mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 2px;}

.noresult{text-align:center;color:var(--muted);padding:60px;font-family:var(--mono);}

/* ============ Footer ============ */
.foot{max-width:var(--maxw);margin:0 auto;padding:40px var(--pad) 70px;
  border-top:1px solid var(--line);display:flex;justify-content:space-between;
  gap:30px;flex-wrap:wrap;align-items:end;}
.foot p{margin:0;font-size:12.5px;color:var(--muted);max-width:58ch;line-height:1.5;}
.foot-mark{font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}

.ring-label{font-family:var(--mono);fill:var(--ink);font-weight:500;}

/* ============ Responsive ============ */
@media(max-width:900px){
  .journey-track{grid-template-columns:repeat(5,1fr);gap:6px;}
  .stop{padding:11px 9px 13px;}
  .stop-code{font-size:21px;}
  .stop-name,.stop-hours{display:none;}
  .level-head{grid-template-columns:1fr;gap:14px;}
  .grid{grid-template-columns:repeat(2,1fr);}
  .card--wide{grid-column:span 2;}
  .list--two{grid-template-columns:1fr;}
  .cando-list{grid-template-columns:1fr;}
  .explainer-grid,.tab-grid,.transfer-grid,.blog-grid,.placement-hero,.placement-stats{grid-template-columns:1fr;}
  .assessment-band{grid-template-columns:1fr;}
