name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: astro-pilot/.node-version
          cache: npm
          cache-dependency-path: astro-pilot/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: astro-pilot

      - name: Build and validate site
        run: npm run build
        working-directory: astro-pilot
        env:
          SITE_URL: https://jameel7007.github.io

      - name: Prepare project-path artifact
        run: npm run pages:prepare
        working-directory: astro-pilot

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: astro-pilot/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
